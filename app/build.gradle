android {
    namespace 'com.fountainpdl.surffountain'
    compileSdk 34

    defaultConfig {
        applicationId "com.fountainpdl.surffountain"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
